<!DOCTYPE html>
<html lang="en">

    <head>
        <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>

    <body>
        <div class="flex items-center justify-center min-h-screen">

            <form id="login-form">
                <fieldset class="fieldset bg-base-200 border-base-300 rounded-box w-xs border p-4">
                    <legend class="fieldset-legend">Login</legend>

                    <label class="label" for="username">Username</label>
                    <input id="username" type="text" name="username" class="input" placeholder="Username" required/>

                    <label class="label" for="password">Password</label>
                    <input id="password" type="password" name="password" class="input" placeholder="Password" required/>

                    <p id="error-message" class="text-error text-sm mt-2 hidden">Invalid username and/or password</p>

                    <button class="btn btn-neutral mt-4", type="submit">Login</button>
                </fieldset>
            </form>

        </div>
    </body>

    <script src="js/auth.js"></script>
</html>
