<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Discover — Anifeed</title>
<link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-base-200 min-h-screen">

  <!-- NAVBAR -->
  <div id="navbar-container"></div>

  <div class="max-w-6xl mx-auto px-4 py-8">

    <h1 class="text-3xl font-bold mb-6">Discover</h1>

    <!-- Tabs -->
    <div role="tablist" class="tabs tabs-boxed w-fit mb-6">
      <a role="tab" id="tab-anime" class="tab tab-active">Anime</a>
      <a role="tab" id="tab-users" class="tab">Users</a>
    </div>

    <!-- ANIME TAB -->
    <div id="panel-anime">

      <label class="input input-bordered flex items-center gap-2 max-w-md mb-8">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
        <input id="anime-search-input" type="text" class="grow" placeholder="Search anime..." />
      </label>

      <p id="anime-results-label" class="text-sm text-base-content/60 mb-4">Currently airing</p>

      <div id="anime-results" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-4">
      </div>

      <!-- Empty state (hidden by default, shown by JS when search returns nothing) -->
      <div id="anime-empty" class="hidden text-center py-16">
        <p class="text-base-content/60">No anime found. Try a different search.</p>
      </div>

    </div>

    <!-- USERS TAB (hidden by default) -->
    <div id="panel-users" class="hidden">

      <label class="input input-bordered flex items-center gap-2 max-w-md mb-8">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
        <input id="user-search-input" type="text" class="grow" placeholder="Search users..." />
      </label>

      <div id="user-results" class="flex flex-col gap-2 max-w-lg">
      </div>

      <!-- Empty state -->
      <div id="user-empty" class="hidden text-center py-16">
        <p class="text-base-content/60">No users found. Try a different search.</p>
      </div>

    </div>

  </div>

  <script>
    const tabAnime = document.getElementById('tab-anime');
    const tabUsers = document.getElementById('tab-users');
    const panelAnime = document.getElementById('panel-anime');
    const panelUsers = document.getElementById('panel-users');

    tabAnime.addEventListener('click', () => {
      tabAnime.classList.add('tab-active');
      tabUsers.classList.remove('tab-active');
      panelAnime.classList.remove('hidden');
      panelUsers.classList.add('hidden');
    });

    tabUsers.addEventListener('click', () => {
      tabUsers.classList.add('tab-active');
      tabAnime.classList.remove('tab-active');
      panelUsers.classList.remove('hidden');
      panelAnime.classList.add('hidden');
    });
  </script>
  <script src="js/api.js"></script>
  <script src="js/navbar.js?v=2"></script>
  <script src="js/discover.js?v=2"></script>
</body>
</html>
